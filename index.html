<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plain Text Diagram Tool</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    font-size: 14px;
    color: #111;
    background: #fff;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid #d0d0d0;
    background: #f6f6f6;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 8px; }
  .controls label { font-size: 13px; }
  select, button {
    font: inherit;
    font-size: 13px;
    padding: 3px 8px;
    border: 1px solid #b0b0b0;
    border-radius: 3px;
    background: #fff;
    color: #111;
  }
  button { cursor: pointer; }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .pane {
    width: 50%;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .pane + .pane { border-left: 1px solid #d0d0d0; }
  .pane-title {
    flex: 0 0 auto;
    padding: 4px 8px;
    font-size: 13px;
    color: #555;
    border-bottom: 1px solid #e5e5e5;
    background: #fafafa;
  }
  .pane-note { margin-left: 8px; color: #8a8a8a; }
  .hint {
    flex: 0 0 auto;
    display: none;
    padding: 6px 8px;
    font-size: 13px;
    color: #555;
    white-space: pre;
    background: #fcfcfc;
    border-bottom: 1px solid #e5e5e5;
  }
  textarea, pre {
    flex: 1 1 auto;
    margin: 0;
    padding: 8px;
    border: 0;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.35;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }
  textarea { background: #fff; }
  pre { background: #fff; }
</style>
</head>
<body>
<header>
  <h1>Plain Text Diagram Tool</h1>
  <div class="controls">
    <button id="copy" type="button">Copy output</button>
    <button id="hint" type="button">Show hint for this type</button>
    <label for="type">Type</label>
    <select id="type"></select>
  </div>
</header>
<main>
  <section class="pane">
    <div class="pane-title">Source text</div>
    <div id="hintNote" class="hint"></div>
    <textarea id="source" wrap="off" spellcheck="false" aria-label="Source text"></textarea>
  </section>
  <section class="pane">
    <div class="pane-title">Output <span id="typeNote" class="pane-note"></span></div>
    <pre id="output" aria-label="Output"></pre>
  </section>
</main>
<script>
(function () {
  "use strict";

  var EXAMPLE = "project/\n  src/\n    main.js\n  README.md";

  var sourceEl = document.getElementById("source");
  var outputEl = document.getElementById("output");
  var typeEl = document.getElementById("type");
  var copyEl = document.getElementById("copy");
  var typeNoteEl = document.getElementById("typeNote");
  var hintEl = document.getElementById("hint");
  var hintNoteEl = document.getElementById("hintNote");

  /* ---------- helpers ---------- */

  function splitLines(text) {
    return String(text).replace(/\r\n?/g, "\n").split("\n");
  }

  /* R-007: the tool removes the spaces at the start and at the end of each line. */
  function cleanLines(lines) {
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var text = lines[i].trim();
      if (text !== "") { out.push(text); }
    }
    return out;
  }

  function indentWidth(line) {
    var width = 0;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (ch === " ") { width += 1; }
      else if (ch === "\t") { width += 2; }
      else { break; }
    }
    return width;
  }

  function repeat(text, count) {
    var out = "";
    for (var i = 0; i < count; i++) { out += text; }
    return out;
  }

  function padRight(text, width) {
    return text + repeat(" ", width - text.length);
  }

  function padLeft(text, width) {
    return repeat(" ", width - text.length) + text;
  }

  function padCenter(text, width) {
    var left = Math.floor((width - text.length) / 2);
    return repeat(" ", left) + text + repeat(" ", width - text.length - left);
  }

  function boxTop(width) {
    return "\u250c" + repeat("\u2500", width) + "\u2510";
  }

  function boxBottom(width) {
    return "\u2514" + repeat("\u2500", width) + "\u2518";
  }

  function boxMiddle(text) {
    return "\u2502 " + text + " \u2502";
  }

  /* ---------- tree diagram (R-030 .. R-037) ---------- */

  function buildTree(lines) {
    var root = { text: "", children: [] };
    var stack = [root];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.trim() === "") { continue; }
      var depth = Math.floor(indentWidth(line) / 2);
      if (depth > stack.length - 1) { depth = stack.length - 1; }
      var parent = stack[depth];
      var node = { text: line.trim(), children: [] };
      parent.children.push(node);
      stack.length = depth + 1;
      stack.push(node);
    }
    return root;
  }

  function drawTree(root) {
    var lines = [];
    walkTree(root, "", lines, true);
    return lines.join("\n");
  }

  function walkTree(node, prefix, lines, isTop) {
    for (var i = 0; i < node.children.length; i++) {
      var child = node.children[i];
      var isLast = i === node.children.length - 1;
      if (isTop) {
        lines.push(child.text);
        walkTree(child, "", lines, false);
      } else {
        lines.push(prefix + (isLast ? "\u2514\u2500\u2500 " : "\u251c\u2500\u2500 ") + child.text);
        walkTree(child, prefix + (isLast ? "    " : "\u2502   "), lines, false);
      }
    }
  }

  /* ---------- table diagram (R-040 .. R-046) ---------- */

  function tableBorder(left, middle, right, widths) {
    var parts = [];
    for (var i = 0; i < widths.length; i++) {
      parts.push(repeat("\u2500", widths[i] + 2));
    }
    return left + parts.join(middle) + right;
  }

  function tableRow(cells, widths) {
    var parts = [];
    for (var i = 0; i < widths.length; i++) {
      var cell = i < cells.length ? cells[i] : "";
      parts.push(" " + cell + repeat(" ", widths[i] - cell.length) + " ");
    }
    return "\u2502" + parts.join("\u2502") + "\u2502";
  }

  function drawTable(lines) {
    var rows = [];
    for (var i = 0; i < lines.length; i++) {
      var cells = lines[i].split("|");
      for (var j = 0; j < cells.length; j++) { cells[j] = cells[j].trim(); }
      rows.push(cells);
    }
    if (rows.length === 0) { return "error: no rows"; }

    var columns = rows[0].length;
    for (i = 0; i < rows.length; i++) {
      if (rows[i].length > columns) { columns = rows[i].length; }
    }

    var widths = [];
    for (i = 0; i < columns; i++) { widths.push(3); }
    for (i = 0; i < rows.length; i++) {
      for (j = 0; j < rows[i].length; j++) {
        if (rows[i][j].length > widths[j]) { widths[j] = rows[i][j].length; }
      }
    }

    var out = [];
    out.push(tableBorder("\u250c", "\u252c", "\u2510", widths));
    out.push(tableRow(rows[0], widths));
    if (rows.length > 1) {
      out.push(tableBorder("\u251c", "\u253c", "\u2524", widths));
      for (i = 1; i < rows.length; i++) { out.push(tableRow(rows[i], widths)); }
    }
    out.push(tableBorder("\u2514", "\u2534", "\u2518", widths));
    return out.join("\n");
  }

  /* ---------- flow diagram (R-050 .. R-057) ---------- */

  function drawFlow(lines) {
    var names = [];
    var seen = {};
    for (var i = 0; i < lines.length; i++) {
      if (!hasArrow(lines[i])) { continue; }
      var parts = lines[i].split(/(?:->|=>|\u2192)/);
      for (var j = 0; j < parts.length; j++) {
        var name = parts[j].trim();
        if (name === "") { continue; }
        if (!seen[name]) { seen[name] = true; names.push(name); }
      }
    }
    if (names.length === 0) { return "error: no arrow"; }

    var top = [];
    var middle = [];
    var bottom = [];
    for (i = 0; i < names.length; i++) {
      if (i > 0) {
        top.push("   ");
        middle.push("\u2500\u2500\u25b6");
        bottom.push("   ");
      }
      var width = names[i].length + 2;
      top.push(boxTop(width));
      middle.push(boxMiddle(names[i]));
      bottom.push(boxBottom(width));
    }
    return [top.join(""), middle.join(""), bottom.join("")].join("\n");
  }

  /* ---------- checklist diagram (R-060 .. R-065) ---------- */

  function drawChecklist(lines) {
    var items = cleanLines(lines);
    if (items.length === 0) { return "error: no source text"; }
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var line = items[i];
      if (/^\[x\]/i.test(line)) {
        out.push("\u2611 " + line.slice(3).trim());
      } else if (/^\[ \]/.test(line)) {
        out.push("\u2610 " + line.slice(3).trim());
      } else {
        return "error: no checkbox";
      }
    }
    return out.join("\n");
  }

  /* ---------- bar diagram (R-070 .. R-076) ---------- */

  function drawBar(lines) {
    var items = cleanLines(lines);
    if (items.length === 0) { return "error: no source text"; }
    var rows = [];
    for (var i = 0; i < items.length; i++) {
      var match = /^(.*?):\s*(-?\d+(?:\.\d+)?)\s*$/.exec(items[i]);
      if (!match) { return "error: no number"; }
      rows.push({ label: match[1].trim(), value: Number(match[2]) });
    }

    var labelWidth = 0;
    var largest = 0;
    for (i = 0; i < rows.length; i++) {
      if (rows[i].label.length > labelWidth) { labelWidth = rows[i].label.length; }
      if (rows[i].value > largest) { largest = rows[i].value; }
    }

    var out = [];
    for (i = 0; i < rows.length; i++) {
      var length = 0;
      if (largest > 0) { length = Math.round(rows[i].value / largest * 30); }
      if (length < 0) { length = 0; }
      out.push(padRight(rows[i].label, labelWidth) + " " + repeat("\u2588", length) + " " + rows[i].value);
    }
    return out.join("\n");
  }

  /* ---------- the hints for the types ---------- */

  var HINTS = {
    auto: "tree:      project/\n           src/\ntable:     Task|Owner\nflow:      Draft -> Review\nchecklist: [x] item\nbar:       Apples: 50",
    tree: "project/\n  src/\n    main.js",
    table: "Task|Owner|Due\nSpec|Ana|Mon",
    flow: "Draft -> Review -> Approved",
    checklist: "[x] Tests pass\n[ ] Security scan",
    bar: "Apples: 50\nBananas: 30\nCherries: 75",
    state: "Draft --submit--> Review\nReview --approve--> Approved",
    timeline: "Q1: Research, Spec\nQ2: Build, MVP",
    kanban: "[Backlog]\nA\nB\n\n[In Progress]\nC\nD",
    matrix: "X: Effort\nY: Impact\nTL: Quick wins\nTR: Big bets\nBL: Fill-ins\nBR: Avoid\nItems: Feature A(TL)",
    heatmap: "|   | Mon | Tue | Wed |\n|AM | 1   | 3   | 2   |\n|PM | 2   | 1   | 3   |",
    sequence: "User -> Web: login\nWeb -> API: auth\nAPI -> DB: query",
    swimlane: "Customer: Submit -> Receive\nSupport: Triage -> Resolve",
    gantt: "Plan: 0-10\nBuild: 10-25\nTest: 25-35"
  };

    /* ---------- state diagram (R-080 .. R-085) ---------- */

  function drawState(lines) {
    var src = cleanLines(lines);
    var names = [];
    var seen = {};
    var edges = [];
    var pattern = /^(.*?)\s*--([^-]+)-->\s*(.*)$/;
    var i;
    for (i = 0; i < src.length; i++) {
      var match = pattern.exec(src[i]);
      if (!match) { return "error: no labeled arrow"; }
      var from = match[1].trim();
      var to = match[3].trim();
      var label = match[2].trim();
      if (from === "" || to === "") { return "error: no labeled arrow"; }
      edges.push({ from: from, to: to, label: label });
      if (!seen[from]) { seen[from] = true; names.push(from); }
      if (!seen[to]) { seen[to] = true; names.push(to); }
    }
    if (names.length === 0) { return "error: no labeled arrow"; }

    var gap = 2;
    for (i = 0; i < edges.length; i++) {
      if (edges[i].label.length + 2 > gap) { gap = edges[i].label.length + 2; }
    }

    var top = [];
    var middle = [];
    var bottom = [];
    for (i = 0; i < names.length; i++) {
      if (i > 0) {
        var label = "";
        for (var j = 0; j < edges.length; j++) {
          if (edges[j].from === names[i - 1] && edges[j].to === names[i]) {
            label = edges[j].label;
            break;
          }
        }
        if (label === "") {
          for (j = 0; j < edges.length; j++) {
            if (edges[j].from === names[i - 1]) { label = edges[j].label; break; }
          }
        }
        top.push(padCenter(label, gap));
        middle.push(repeat("─", gap - 1) + "▶");
        bottom.push(repeat(" ", gap));
      }
      var width = names[i].length + 2;
      top.push(boxTop(width));
      middle.push(boxMiddle(names[i]));
      bottom.push(boxBottom(width));
    }
    return [top.join(""), middle.join(""), bottom.join("")].join("\n");
  }

  /* ---------- timeline diagram (R-090 .. R-095) ---------- */

  function drawTimeline(lines) {
    var src = cleanLines(lines);
    if (src.length === 0) { return "error: no period"; }
    var periods = [];
    var width = 0;
    var i;
    var j;
    for (i = 0; i < src.length; i++) {
      var colon = src[i].indexOf(":");
      if (colon < 0) { return "error: no period"; }
      var period = src[i].slice(0, colon).trim();
      var rest = src[i].slice(colon + 1);
      if (period === "") { return "error: no period"; }
      var parts = rest.split(",");
      var events = [];
      for (j = 0; j < parts.length; j++) {
        var name = parts[j].trim();
        if (name !== "") { events.push(name); }
      }
      if (events.length === 0) { return "error: no period"; }
      periods.push({ name: period, events: events });
      if (period.length > width) { width = period.length; }
    }
    width = width + 1;

    var out = [];
    for (i = 0; i < periods.length; i++) {
      for (j = 0; j < periods[i].events.length; j++) {
        var last = (j === periods[i].events.length - 1);
        var marker = last ? "└─" : "├─";
        var left = (j === 0) ? padRight(periods[i].name, width) : repeat(" ", width);
        out.push(left + marker + " " + periods[i].events[j]);
      }
    }
    return out.join("\n");
  }

  /* ---------- kanban diagram (R-100 .. R-107) ---------- */

  function drawKanban(lines) {
    var src = cleanLines(lines);
    var columns = [];
    var i;
    var j;
    for (i = 0; i < src.length; i++) {
      var match = /^\[([^\]]*)\]$/.exec(src[i]);
      if (match) {
        columns.push({ header: match[1].trim(), cards: [], width: 6 });
      } else if (columns.length > 0) {
        columns[columns.length - 1].cards.push(src[i]);
      }
    }
    if (columns.length === 0) { return "error: no column"; }

    var maxCards = 0;
    for (i = 0; i < columns.length; i++) {
      var width = columns[i].header.length;
      for (j = 0; j < columns[i].cards.length; j++) {
        if (columns[i].cards[j].length > width) { width = columns[i].cards[j].length; }
      }
      if (width < 6) { width = 6; }
      columns[i].width = width;
      if (columns[i].cards.length > maxCards) { maxCards = columns[i].cards.length; }
    }

    var blocks = [];
    for (i = 0; i < columns.length; i++) {
      var w = columns[i].width;
      var block = [];
      block.push(tableBorder("┌", "┬", "┐", [w]));
      block.push(tableRow([padCenter(columns[i].header, w)], [w]));
      block.push(tableBorder("├", "┼", "┤", [w]));
      for (j = 0; j < maxCards; j++) {
        var card = j < columns[i].cards.length ? columns[i].cards[j] : "";
        block.push(tableRow([card], [w]));
      }
      block.push(tableBorder("└", "┴", "┘", [w]));
      blocks.push(block);
    }

    var out = [];
    for (i = 0; i < blocks[0].length; i++) {
      var parts = [];
      for (j = 0; j < blocks.length; j++) { parts.push(blocks[j][i]); }
      out.push(parts.join(" "));
    }
    return out.join("\n");
  }

  /* ---------- matrix diagram (R-110 .. R-116) ---------- */

  function drawMatrix(lines) {
    var src = cleanLines(lines);
    var data = {};
    var keys = ["X", "Y", "TL", "TR", "BL", "BR", "Items"];
    var i;
    var j;
    for (i = 0; i < src.length; i++) {
      var match = /^([A-Za-z]+)\s*:\s*(.*)$/.exec(src[i]);
      if (!match) { continue; }
      var key = match[1].toUpperCase();
      if (data[key] === undefined) { data[key] = match[2].trim(); }
    }
    for (i = 0; i < keys.length; i++) {
      if (data[keys[i].toUpperCase()] === undefined) { return "error: missing " + keys[i]; }
    }

    var items = { TL: [], TR: [], BL: [], BR: [] };
    var parts = data.ITEMS.split(",");
    for (i = 0; i < parts.length; i++) {
      var part = parts[i].trim();
      if (part === "") { continue; }
      var im = /^(.*)\((TL|TR|BL|BR)\)$/.exec(part);
      if (!im) { continue; }
      var name = im[1].trim();
      if (name !== "") { items[im[2]].push(name); }
    }

    var yName = data.Y;
    var yWidth = Math.max(yName.length, 4, 3) + 1;

    var quadrants = [
      { key: "TL", text: data.TL, items: items.TL },
      { key: "TR", text: data.TR, items: items.TR },
      { key: "BL", text: data.BL, items: items.BL },
      { key: "BR", text: data.BR, items: items.BR }
    ];
    var longest = 0;
    for (i = 0; i < quadrants.length; i++) {
      quadrants[i].itemText = quadrants[i].items.join(", ");
      if (quadrants[i].text.length > longest) { longest = quadrants[i].text.length; }
      if (quadrants[i].itemText.length > longest) { longest = quadrants[i].itemText.length; }
    }
    var cellWidth = longest + 4;
    var widths = [cellWidth - 2, cellWidth - 2];

    var firstLabel = yWidth + 3;
    var secondLabel = firstLabel + cellWidth + 3;

    var out = [];

    var label2 = "High";
    var nameStart = Math.floor((firstLabel + (secondLabel + label2.length - 1)) / 2) - Math.floor(data.X.length / 2);
    if (nameStart < 0) { nameStart = 0; }
    out.push(repeat(" ", nameStart) + data.X);

    var axisLine = [];
    for (i = 0; i < secondLabel + label2.length; i++) { axisLine.push(" "); }
    axisLine[firstLabel] = "L";
    axisLine[firstLabel + 1] = "o";
    axisLine[firstLabel + 2] = "w";
    axisLine[secondLabel] = "H";
    axisLine[secondLabel + 1] = "i";
    axisLine[secondLabel + 2] = "g";
    axisLine[secondLabel + 3] = "h";
    out.push(axisLine.join(""));

    var gap = repeat(" ", yWidth);
    out.push(gap + tableBorder("┌", "┬", "┐", widths));
    out.push(padRight("High", yWidth) + tableRow([quadrants[0].text, quadrants[1].text], widths));
    out.push(padRight(yName, yWidth) + tableRow([quadrants[0].itemText, quadrants[1].itemText], widths));
    out.push(gap + tableBorder("├", "┼", "┤", widths));
    out.push(padRight("Low", yWidth) + tableRow([quadrants[2].text, quadrants[3].text], widths));
    out.push(padRight(yName, yWidth) + tableRow([quadrants[2].itemText, quadrants[3].itemText], widths));
    out.push(gap + tableBorder("└", "┴", "┘", widths));
    return out.join("\n");
  }

  /* ---------- heatmap diagram (R-120 .. R-126) ---------- */

  function drawHeatmap(lines) {
    var src = cleanLines(lines);
    if (src.length === 0) { return "error: bad value"; }
    var rows = [];
    var i;
    var j;
    for (i = 0; i < src.length; i++) {
      var cells = src[i].split("|");
      if (cells.length > 0 && cells[0].trim() === "" && src[i].charAt(0) === "|") { cells.shift(); }
      if (cells.length > 0 && cells[cells.length - 1].trim() === "" && src[i].charAt(src[i].length - 1) === "|") { cells.pop(); }
      for (j = 0; j < cells.length; j++) { cells[j] = cells[j].trim(); }
      rows.push(cells);
    }

    var headers = rows[0];
    var names = [];
    for (i = 1; i < rows.length; i++) {
      names.push({ name: rows[i][0], values: rows[i].slice(1) });
    }

    var nameWidth = 0;
    for (i = 0; i < names.length; i++) {
      if (names[i].name.length > nameWidth) { nameWidth = names[i].name.length; }
    }

    var widths = [];
    for (j = 0; j < headers.length - 1; j++) {
      var w = headers[j + 1].length;
      if (w < 3) { w = 3; }
      widths.push(w + 1);
    }

    var gridStart = nameWidth + 4;
    var out = [];

    var head = [];
    for (i = 0; i < gridStart; i++) { head.push(" "); }
    for (j = 0; j < widths.length; j++) {
      var text = j + 1 < headers.length ? headers[j + 1] : "";
      head.push(padRight(text, widths[j]));
    }
    out.push(head.join("").replace(/\s+$/, ""));

    for (i = 0; i < names.length; i++) {
      var row = [];
      row.push(padRight(names[i].name, gridStart));
      for (j = 0; j < widths.length; j++) {
        var raw = j < names[i].values.length ? names[i].values[j] : "";
        if (!/^[0-3]$/.test(raw)) { return "error: bad value"; }
        var shade = raw === "0" ? " " : (raw === "1" ? "░" : (raw === "2" ? "▒" : "▓"));
        row.push(padCenter(shade, widths[j]));
      }
      out.push(row.join("").replace(/\s+$/, ""));
    }
    return out.join("\n");
  }

    /* ---------- sequence diagram (R-130 .. R-136) ---------- */

  function drawSequence(lines) {
    var items = cleanLines(lines);
    if (items.length === 0) { return "error: no message"; }

    var msgs = [];
    var names = [];
    var seen = {};
    var i, j, m;
    for (i = 0; i < items.length; i++) {
      m = /^(.*?)\s*->\s*(.*?):\s*(.*)$/.exec(items[i]);
      if (!m) { return "error: no message"; }
      var from = m[1].trim();
      var to = m[2].trim();
      var text = m[3].trim();
      if (from === "" || to === "") { return "error: no message"; }
      if (!seen["n:" + from]) { seen["n:" + from] = true; names.push(from); }
      if (!seen["n:" + to]) { seen["n:" + to] = true; names.push(to); }
      msgs.push([from, to, text]);
    }

    var maxLen = 0;
    for (i = 0; i < names.length; i++) {
      if (names[i].length > maxLen) { maxLen = names[i].length; }
    }
    var pitch = Math.max(maxLen, 4) + 10;
    var count = names.length;

    /* the lifeline sits under the name: for an even long name it is one
       column right of the name start, otherwise it is at the name start. */
    var lf = [];
    for (i = 0; i < count; i++) {
      var len = names[i].length;
      var off = (len % 2 === 0) ? Math.floor((len - 1) / 2) : 0;
      lf.push(i * pitch + off);
    }

    var headLen = (count - 1) * pitch + names[count - 1].length;
    var head = [];
    for (i = 0; i < headLen; i++) { head.push(" "); }
    for (i = 0; i < count; i++) {
      for (j = 0; j < names[i].length; j++) {
        head[i * pitch + j] = names[i].charAt(j);
      }
    }

    var out = [head.join("")];
    var rowLen = lf[count - 1] + 1;
    for (i = 0; i < msgs.length; i++) {
      var sIdx = names.indexOf(msgs[i][0]);
      var rIdx = names.indexOf(msgs[i][1]);
      var row = [];
      for (j = 0; j < rowLen; j++) { row.push(" "); }
      for (j = 0; j < count; j++) { row[lf[j]] = "│"; }

      var s = lf[sIdx];
      var r = lf[rIdx];
      var label = msgs[i][2];
      var arrow = "";
      var start = 0;
      if (s !== r) {
        var free = 0;
        var len = 0;
        if (s < r) {
          free = r - s - 1;
          len = free - 1;
          if (len % 2 !== 0) { len = len - 1; }
          if (len < 0) { len = 0; }
          if (label.length > len - 3) { label = label.slice(0, Math.max(0, len - 3)); }
          var dashes = len - 3 - label.length;
          if (dashes < 0) { dashes = 0; }
          arrow = "──" + label + repeat("─", dashes) + "▶";
          start = s + 1;
        } else {
          free = s - r - 1;
          len = free - 2;
          if (len < 0) { len = 0; }
          if (label.length > len - 3) { label = label.slice(0, Math.max(0, len - 3)); }
          var back = len - 3 - label.length;
          if (back < 0) { back = 0; }
          arrow = "◀" + "──" + label + repeat("─", back);
          start = r + 1 + Math.floor((free - len) / 2);
        }
        for (j = 0; j < arrow.length; j++) {
          if (start + j < rowLen) { row[start + j] = arrow.charAt(j); }
        }
      }
      out.push(row.join(""));
    }
    return out.join("\n");
  }

  /* ---------- swimlane diagram (R-140 .. R-146) ---------- */

  function drawSwimlane(lines) {
    var items = cleanLines(lines);
    if (items.length === 0) { return "error: no lane"; }

    var lanes = [];
    var maxName = 0;
    var i, j, k;
    for (i = 0; i < items.length; i++) {
      var cut = items[i].indexOf(":");
      if (cut < 0) { return "error: no lane"; }
      var laneName = items[i].slice(0, cut).trim();
      var parts = items[i].slice(cut + 1).split("->");
      var steps = [];
      for (j = 0; j < parts.length; j++) {
        var step = parts[j].trim();
        if (step !== "") { steps.push(step); }
      }
      if (steps.length === 0) { return "error: no lane"; }
      lanes.push({ name: laneName, steps: steps });
      if (laneName.length > maxName) { maxName = laneName.length; }
    }

    var nameWidth = maxName + 1;
    var stepCount = 0;
    for (i = 0; i < lanes.length; i++) {
      if (lanes[i].steps.length > stepCount) { stepCount = lanes[i].steps.length; }
    }

    /* the width of a step column is the widest box of that step in all lanes */
    var content = [];
    for (i = 0; i < stepCount; i++) {
      var wide = 0;
      for (k = 0; k < lanes.length; k++) {
        if (i < lanes[k].steps.length) {
          var w = lanes[k].steps[i].length + 2;
          if (w > wide) { wide = w; }
        }
      }
      content.push(wide);
    }

    /* every lane uses the same columns */
    var starts = [];
    var pos = nameWidth;
    for (i = 0; i < stepCount; i++) {
      starts.push(pos);
      pos += content[i] + 2 + 3;
    }

    var out = [];
    for (i = 0; i < lanes.length; i++) {
      var lane = lanes[i];
      var num = lane.steps.length;
      var own = [];
      for (j = 0; j < num; j++) { own.push(lane.steps[j].length + 2); }

      var end = starts[num - 1] + own[num - 1] + 2;
      var top = [];
      var mid = [];
      var bot = [];
      for (j = 0; j < end; j++) { top.push(" "); mid.push(" "); bot.push(" "); }
      for (j = 0; j < lane.name.length; j++) { top[j] = lane.name.charAt(j); }

      for (j = 0; j < num; j++) {
        var t = boxTop(own[j]);
        var m = boxMiddle(lane.steps[j]);
        var b = boxBottom(own[j]);
        for (k = 0; k < t.length; k++) { top[starts[j] + k] = t.charAt(k); }
        for (k = 0; k < m.length; k++) { mid[starts[j] + k] = m.charAt(k); }
        for (k = 0; k < b.length; k++) { bot[starts[j] + k] = b.charAt(k); }
      }

      for (j = 0; j + 1 < num; j++) {
        var gap = starts[j] + own[j] + 2;
        var arrow = "──▶";
        for (k = 0; k < arrow.length; k++) {
          if (gap + k < mid.length) { mid[gap + k] = arrow.charAt(k); }
        }
      }

      out.push(top.join(""), mid.join(""), bot.join(""));
    }
    return out.join("\n");
  }

  /* ---------- gantt diagram (R-150 .. R-156) ---------- */

  function drawGantt(lines) {
    var items = cleanLines(lines);
    if (items.length === 0) { return "error: bad range"; }

    var tasks = [];
    var minStart = null;
    var maxEnd = null;
    var maxName = 0;
    var i, j;
    for (i = 0; i < items.length; i++) {
      var m = /^(.*?):\s*(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)\s*$/.exec(items[i]);
      if (!m) { return "error: bad range"; }
      var name = m[1].trim();
      var start = Number(m[2]);
      var end = Number(m[3]);
      if (!(start < end)) { return "error: bad range"; }
      tasks.push({ name: name, start: start, end: end });
      if (name.length > maxName) { maxName = name.length; }
      if (minStart === null || start < minStart) { minStart = start; }
      if (maxEnd === null || end > maxEnd) { maxEnd = end; }
    }

    var nameWidth = Math.max(maxName, 4) + 3;
    var span = maxEnd - minStart;
    var scale = 40 / span;

    function ganttColumn(value) {
      return nameWidth + Math.round((value - minStart) * scale);
    }
    function ganttNumber(value) {
      return String(Math.round(value * 100) / 100);
    }

    var tickValue = [];
    var tickColumn = [];
    for (i = 0; i < 5; i++) {
      var value = minStart + span * i / 4;
      tickValue.push(ganttNumber(value));
      tickColumn.push(ganttColumn(value));
    }

    var headLength = Math.max(nameWidth, tickColumn[4] + tickValue[4].length);
    var head = [];
    for (i = 0; i < headLength; i++) { head.push(" "); }
    var label = "Task";
    for (j = 0; j < label.length; j++) { head[j] = label.charAt(j); }
    for (i = 0; i < 5; i++) {
      for (j = 0; j < tickValue[i].length; j++) {
        if (tickColumn[i] + j < headLength) { head[tickColumn[i] + j] = tickValue[i].charAt(j); }
      }
    }

    var axisLength = tickColumn[4] + 1;
    var axis = [];
    for (i = 0; i < axisLength; i++) { axis.push("─"); }
    for (i = 0; i < nameWidth; i++) { axis[i] = " "; }
    for (i = 0; i < 5; i++) {
      if (tickColumn[i] < axisLength) { axis[tickColumn[i]] = "│"; }
    }

    var out = [head.join(""), axis.join("")];
    for (i = 0; i < tasks.length; i++) {
      var from = ganttColumn(tasks[i].start);
      var to = ganttColumn(tasks[i].end);
      var bar = to - from;
      if (bar < 1) { bar = 1; }
      var line = padRight(tasks[i].name, nameWidth);
      if (from > nameWidth) { line += repeat(" ", from - nameWidth); }
      line += repeat("█", bar);
      out.push(line);
    }
    return out.join("\n");
  }

  /* ---------- the types (Section 4.0) ---------- */

  var TYPES = [
    { id: "tree", name: "Tree", draw: function (lines) {
        var root = buildTree(lines);
        if (root.children.length === 0) { return "error: no source text"; }
        return drawTree(root);
      } },
    { id: "table", name: "Table", draw: function (lines) { return drawTable(cleanLines(lines)); } },
    { id: "flow", name: "Flow", draw: function (lines) { return drawFlow(cleanLines(lines)); } },
    { id: "checklist", name: "Checklist", draw: function (lines) { return drawChecklist(lines); } },
    { id: "bar", name: "Bar", draw: function (lines) { return drawBar(lines); } },
    { id: "state", name: "State", draw: drawState },
    { id: "timeline", name: "Timeline", draw: drawTimeline },
    { id: "kanban", name: "Kanban", draw: drawKanban },
    { id: "matrix", name: "Matrix", draw: drawMatrix },
    { id: "heatmap", name: "Heatmap", draw: drawHeatmap },
    { id: "sequence", name: "Sequence", draw: drawSequence },
    { id: "swimlane", name: "Swimlane", draw: drawSwimlane },
    { id: "gantt", name: "Gantt", draw: drawGantt }
  ];

  function typeById(id) {
    for (var i = 0; i < TYPES.length; i++) {
      if (TYPES[i].id === id) { return TYPES[i]; }
    }
    return null;
  }

  /* ---------- automatic type detection (R-020 .. R-024) ---------- */

  function hasArrow(line) {
    return /->|=>|\u2192/.test(line);
  }

  function isChecklistLine(line) {
    return /^\[x\] /i.test(line) || /^\[ \] /.test(line);
  }

  function isKanbanLine(line) {
    return /^\[[^\]]+\]$/.test(line);
  }

  function isStateLine(line) {
    return /--[^->]+-->/.test(line);
  }

  function isSequenceLine(line) {
    var arrow = line.indexOf("->");
    if (arrow < 0) { return false; }
    return line.indexOf(":", arrow) > arrow;
  }

  function isMatrixLine(line) {
    return /^[XY]:/.test(line);
  }

  function isGanttLine(line) {
    return /:\s*-?\d+(?:\.\d+)?\s*-\s*-?\d+(?:\.\d+)?/.test(line);
  }

  function isBarLine(line) {
    return /^.+?:\s*-?\d+(?:\.\d+)?$/.test(line);
  }

  function isTimelineLine(line) {
    return /:\s*[^,:]+,\s*[^,:]+/.test(line);
  }

  function isSwimlaneLine(line) {
    var colon = line.indexOf(":");
    if (colon < 0) { return false; }
    return line.indexOf("->", colon) > colon;
  }

  function isHeatmapText(lines) {
    if (lines.length < 2) { return false; }
    var rows = [];
    for (var i = 0; i < lines.length; i++) {
      var cells = lines[i].split("|");
      if (cells.length > 1 && cells[0] === "") { cells.shift(); }
      if (cells.length > 1 && cells[cells.length - 1] === "") { cells.pop(); }
      for (var j = 0; j < cells.length; j++) { cells[j] = cells[j].trim(); }
      rows.push(cells);
    }
    if (rows[0].length < 2 || rows[0][0] !== "") { return false; }
    for (i = 1; i < rows.length; i++) {
      if (rows[i].length !== rows[0].length) { return false; }
      for (j = 1; j < rows[i].length; j++) {
        if (!/^[0-3]$/.test(rows[i][j])) { return false; }
      }
    }
    return true;
  }

  function detectType(text) {
    var raw = splitLines(text);
    var lines = cleanLines(raw);
    var i;

    for (i = 0; i < lines.length; i++) {
      if (isChecklistLine(lines[i])) { return "checklist"; }
    }
    for (i = 0; i < lines.length; i++) {
      if (isKanbanLine(lines[i])) { return "kanban"; }
    }
    for (i = 0; i < lines.length; i++) {
      if (isStateLine(lines[i])) { return "state"; }
    }
    for (i = 0; i < lines.length; i++) {
      if (isSequenceLine(lines[i])) { return "sequence"; }
    }
    var hasX = false;
    var hasY = false;
    for (i = 0; i < lines.length; i++) {
      if (/^X:/.test(lines[i])) { hasX = true; }
      if (/^Y:/.test(lines[i])) { hasY = true; }
    }
    if (hasX && hasY) { return "matrix"; }
    for (i = 0; i < lines.length; i++) {
      if (isGanttLine(lines[i])) { return "gantt"; }
    }
    if (lines.length > 0) {
      var allBars = true;
      for (i = 0; i < lines.length; i++) {
        if (!isBarLine(lines[i])) { allBars = false; break; }
      }
      if (allBars) { return "bar"; }
    }
    for (i = 0; i < lines.length; i++) {
      if (isTimelineLine(lines[i])) { return "timeline"; }
    }
    for (i = 0; i < lines.length; i++) {
      if (isSwimlaneLine(lines[i])) { return "swimlane"; }
    }
    if (isHeatmapText(lines)) { return "heatmap"; }
    for (i = 0; i < lines.length; i++) {
      if (hasArrow(lines[i])) { return "flow"; }
    }
    for (i = 0; i < lines.length; i++) {
      if (lines[i].split("|").length - 1 >= 2) { return "table"; }
    }
    for (i = 0; i < raw.length; i++) {
      if (indentWidth(raw[i]) > 0) { return "tree"; }
    }
    return "tree";
  }

  /* ---------- draw (R-005, R-160 .. R-165) ---------- */

  function draw() {
    var text = sourceEl.value;
    var id = typeEl.value;
    var type;
    if (id === "auto") {
      id = detectType(text);
      type = typeById(id);
    } else {
      type = typeById(id);
    }
    outputEl.textContent = type.draw(splitLines(text));
    typeNoteEl.textContent = "Type: " + type.name;
  }

  /* ---------- the selector (R-011, R-012) ---------- */

  function fillSelector() {
    var auto = document.createElement("option");
    auto.value = "auto";
    auto.text = "Auto";
    auto.selected = true;
    typeEl.appendChild(auto);
    for (var i = 0; i < TYPES.length; i++) {
      var option = document.createElement("option");
      option.value = TYPES[i].id;
      option.text = TYPES[i].name;
      typeEl.appendChild(option);
    }
  }

  /* ---------- events ---------- */

  sourceEl.addEventListener("input", draw);
  typeEl.addEventListener("change", function () {
    draw();
    updateHint();
  });

  /* The hint button shows an example for the type. The button never changes the source text. */
  var hintShown = false;

  function updateHint() {
    var text = HINTS[typeEl.value] || "";
    sourceEl.placeholder = text;
    if (!hintShown) { return; }
    hintNoteEl.textContent = text;
  }

  function toggleHint() {
    hintShown = !hintShown;
    if (hintShown) {
      hintNoteEl.style.display = "block";
      hintNoteEl.textContent = HINTS[typeEl.value] || "";
      hintEl.textContent = "Hide hint for this type";
    } else {
      hintNoteEl.style.display = "none";
      hintNoteEl.textContent = "";
      hintEl.textContent = "Show hint for this type";
    }
    sourceEl.placeholder = HINTS[typeEl.value] || "";
  }

  hintEl.addEventListener("click", toggleHint);

  var copyTimer = null;

  function showCopyNote(text) {
    copyEl.textContent = text;
    if (copyTimer) { clearTimeout(copyTimer); }
    copyTimer = setTimeout(function () {
      copyEl.textContent = "Copy output";
      copyTimer = null;
    }, 1200);
  }

  function selectOutput() {
    var range = document.createRange();
    range.selectNodeContents(outputEl);
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }

  copyEl.addEventListener("click", function () {
    var text = outputEl.textContent;
    var done = function () { showCopyNote("Copied"); };
    var failed = function () { selectOutput(); showCopyNote("Copy failed"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, failed);
    } else {
      selectOutput();
      document.execCommand("copy");
      done();
    }
  });

  fillSelector();
  sourceEl.value = EXAMPLE;
  draw();
})();
</script>
</body>
</html>
